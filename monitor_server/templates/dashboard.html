<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Honey SOC Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

<!-- Header -->
<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
        <div class="w-3 h-3 bg-green-500 rounded-full pulse"></div>
        <h1 class="text-xl font-bold text-white">Honey SOC Monitor</h1>
        <span class="text-xs text-gray-500 font-mono">LIVE</span>
    </div>
    <div class="text-sm text-gray-400">
        Welcome, <span class="text-amber-400 font-bold">{{ user }}</span>
        <span class="ml-4 font-mono text-xs" id="clock"></span>
    </div>
</header>

<!-- Stats Row -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6">
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Total Attacks</p>
        <h3 class="text-3xl font-black text-white mt-1" id="statTotal">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-amber-500 uppercase tracking-wider">SQL Injection</p>
        <h3 class="text-3xl font-black text-amber-400 mt-1" id="statSqli">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-red-500 uppercase tracking-wider">RCE / LFI</p>
        <h3 class="text-3xl font-black text-red-400 mt-1" id="statRce">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-purple-500 uppercase tracking-wider">XSS / Other</p>
        <h3 class="text-3xl font-black text-purple-400 mt-1" id="statOther">-</h3>
    </div>
</div>

<!-- Log Table -->
<div class="px-6 pb-6">
    <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="font-bold text-white flex items-center gap-2">
                <span class="w-2 h-2 bg-red-500 rounded-full pulse"></span>
                실시간 공격 로그
            </h2>
            <div class="flex gap-2">
                <button id="aiReportBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-lg">🤖 AI 리포트</button>
                <button id="refreshBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm px-4 py-2 rounded-lg border border-gray-700">새로고침</button>
            </div>
        </div>
        <div class="overflow-x-auto max-h-[500px] overflow-y-auto">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-500 uppercase bg-gray-950">
                    <tr>
                        <th class="px-4 py-3">Timestamp</th>
                        <th class="px-4 py-3">Attacker IP</th>
                        <th class="px-4 py-3">Endpoint</th>
                        <th class="px-4 py-3">Attack Type</th>
                        <th class="px-4 py-3">Payload</th>
                    </tr>
                </thead>
                <tbody id="logBody" class="divide-y divide-gray-800 font-mono">
                    <tr><td colspan="5" class="py-12 text-center text-gray-600">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- AI Report Modal -->
<div id="aiModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col border border-gray-700">
        <div class="p-5 border-b border-gray-700 flex justify-between items-center">
            <h3 class="font-black text-white text-lg">🤖 AI 보안 분석 리포트</h3>
            <button id="closeModal" class="text-gray-500 hover:text-white text-2xl leading-none">×</button>
        </div>
        <div id="aiContent" class="p-6 overflow-y-auto prose prose-invert max-w-none"></div>
    </div>
</div>

<script>
    // Clock
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR'); }, 1000);

    function escHtml(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function badgeColor(t) {
        if (t.includes('SQL')) return 'bg-amber-900/50 text-amber-300 border border-amber-700';
        if (t.includes('RCE') || t.includes('Command') || t.includes('LFI')) return 'bg-red-900/50 text-red-300 border border-red-700';
        if (t.includes('XSS')) return 'bg-purple-900/50 text-purple-300 border border-purple-700';
        if (t.includes('Prompt')) return 'bg-blue-900/50 text-blue-300 border border-blue-700';
        return 'bg-gray-800 text-gray-400';
    }

    let allLogs = [];
    async function fetchLogs() {
        const res = await fetch('/api/logs');
        allLogs = await res.json();
        
        let sqli = 0, rce = 0, other = 0;
        let rows = '';
        allLogs.forEach(l => {
            if (l.type.includes('SQL')) sqli++;
            else if (l.type.includes('RCE') || l.type.includes('Command') || l.type.includes('LFI')) rce++;
            else other++;
            
            rows += `<tr class="hover:bg-gray-800/50">
                <td class="px-4 py-2.5 text-gray-500 text-xs">${escHtml(l.timestamp)}</td>
                <td class="px-4 py-2.5"><span class="bg-gray-800 px-2 py-0.5 rounded text-xs font-bold">${escHtml(l.ip)}</span></td>
                <td class="px-4 py-2.5 text-gray-400 text-xs">${escHtml(l.endpoint)}</td>
                <td class="px-4 py-2.5"><span class="px-2 py-0.5 rounded-full text-xs font-bold ${badgeColor(l.type)}">${escHtml(l.type)}</span></td>
                <td class="px-4 py-2.5 text-red-400 max-w-xs truncate text-xs" title="${escHtml(l.payload)}">${escHtml(l.payload)}</td>
            </tr>`;
        });

        document.getElementById('logBody').innerHTML = rows || '<tr><td colspan="5" class="py-12 text-center text-gray-600">공격 로그 없음</td></tr>';
        document.getElementById('statTotal').textContent = allLogs.length;
        document.getElementById('statSqli').textContent = sqli;
        document.getElementById('statRce').textContent = rce;
        document.getElementById('statOther').textContent = other;
    }

    document.getElementById('refreshBtn').addEventListener('click', fetchLogs);
    fetchLogs();
    setInterval(fetchLogs, 15000);

    // AI Report
    document.getElementById('aiReportBtn').addEventListener('click', async () => {
        const modal = document.getElementById('aiModal');
        const content = document.getElementById('aiContent');
        content.innerHTML = '<div class="text-center py-20 text-gray-500">AI 분석 생성 중...</div>';
        modal.classList.remove('hidden');

        const res = await fetch('/api/ai-report');
        const data = await res.json();
        if (data.status === 'success') {
            content.innerHTML = marked.parse(data.report);
        } else {
            content.innerHTML = `<p class="text-red-400">${escHtml(data.message)}</p>`;
        }
    });

    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('aiModal').classList.add('hidden');
    });
</script>
</body>
</html>
