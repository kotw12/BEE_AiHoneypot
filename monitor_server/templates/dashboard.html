<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Honey SOC Monitor</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

<header class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
        <div class="w-3 h-3 bg-green-500 rounded-full pulse"></div>
        <h1 class="text-xl font-bold text-white">Honey SOC Monitor</h1>
        <span class="text-xs text-gray-500 font-mono">LIVE</span>
    </div>
    <div class="text-sm text-gray-400">
        Welcome, <span class="text-amber-400 font-bold">{{ user }}</span>
        <span class="ml-4 font-mono text-xs" id="clock"></span>
    </div>
</header>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6">
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-gray-500 uppercase tracking-wider">Total Attacks</p>
        <h3 class="text-3xl font-black text-white mt-1" id="statTotal">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-amber-500 uppercase tracking-wider">SQL Injection</p>
        <h3 class="text-3xl font-black text-amber-400 mt-1" id="statSqli">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-red-500 uppercase tracking-wider">RCE / LFI</p>
        <h3 class="text-3xl font-black text-red-400 mt-1" id="statRce">-</h3>
    </div>
    <div class="bg-gray-900 rounded-xl p-4 border border-gray-800">
        <p class="text-xs text-purple-500 uppercase tracking-wider">XSS / Other</p>
        <h3 class="text-3xl font-black text-purple-400 mt-1" id="statOther">-</h3>
    </div>
</div>

<div class="px-6 pb-6">
    <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
        <div class="px-5 py-4 border-b border-gray-800 flex justify-between items-center">
            <h2 class="font-bold text-white flex items-center gap-2">
                <span class="w-2 h-2 bg-red-500 rounded-full pulse"></span>
                실시간 공격 로그
            </h2>
            <div class="flex gap-2">
                <button id="aiReportBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">🤖 AI 리포트 생성</button>
                <button id="refreshBtn" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-sm px-4 py-2 rounded-lg border border-gray-700 transition-colors">새로고침</button>
            </div>
        </div>
        <div class="overflow-x-auto max-h-[500px] overflow-y-auto relative">
            <table class="w-full text-sm text-left">
                <thead class="text-xs text-gray-500 uppercase bg-gray-950 sticky top-0 shadow-md">
                    <tr>
                        <th class="px-4 py-3">Timestamp</th>
                        <th class="px-4 py-3">Attacker IP</th>
                        <th class="px-4 py-3">Endpoint</th>
                        <th class="px-4 py-3">Attack Type</th>
                        <th class="px-4 py-3 w-1/3">Payload</th>
                    </tr>
                </thead>
                <tbody id="logBody" class="divide-y divide-gray-800 font-mono">
                    <tr><td colspan="5" class="py-12 text-center text-gray-600">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div id="aiModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 rounded-2xl shadow-2xl w-full max-w-4xl max-h-[85vh] flex flex-col border border-gray-700">
        <div class="p-5 border-b border-gray-700 flex justify-between items-center bg-gray-900 rounded-t-2xl sticky top-0 z-10">
            <h3 class="font-black text-white text-xl">🤖 AI 보안 분석 리포트</h3>
            <button id="closeModal" class="text-gray-400 hover:text-white text-3xl leading-none transition-colors">&times;</button>
        </div>
        <div class="p-8 overflow-y-auto">
            <div id="aiContent" class="prose prose-invert prose-indigo max-w-none"></div>
        </div>
    </div>
</div>

<script>
    // Clock
    setInterval(() => { document.getElementById('clock').textContent = new Date().toLocaleTimeString('ko-KR'); }, 1000);

    // XSS 방어 함수
    function escHtml(s) {
        return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // 뱃지 색상 판별 함수 (안전하게 처리)
    function badgeColor(t) {
        const typeStr = String(t || '').toUpperCase();
        if (typeStr.includes('SQL')) return 'bg-amber-900/50 text-amber-300 border border-amber-700';
        if (typeStr.includes('RCE') || typeStr.includes('COMMAND') || typeStr.includes('LFI')) return 'bg-red-900/50 text-red-300 border border-red-700';
        if (typeStr.includes('XSS')) return 'bg-purple-900/50 text-purple-300 border border-purple-700';
        return 'bg-gray-800 text-gray-400';
    }

    let allLogs = [];
    
    // 로그 데이터 로드 및 렌더링
    async function fetchLogs() {
        try {
            const res = await fetch('/api/logs');
            if (!res.ok) throw new Error('Network response was not ok');
            allLogs = await res.json();
            
            let sqli = 0, rce = 0, other = 0;
            let rows = '';
            
            allLogs.forEach(l => {
                const typeStr = String(l.type || '').toUpperCase();
                
                // 통계 계산
                if (typeStr.includes('SQL')) sqli++;
                else if (typeStr.includes('RCE') || typeStr.includes('COMMAND') || typeStr.includes('LFI')) rce++;
                else other++;
                
                // 테이블 로우 생성
                rows += `<tr class="hover:bg-gray-800/50 transition-colors">
                    <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">${escHtml(l.timestamp)}</td>
                    <td class="px-4 py-3"><span class="bg-gray-800 px-2 py-1 rounded text-xs font-bold text-gray-300">${escHtml(l.ip)}</span></td>
                    <td class="px-4 py-3 text-gray-400 text-xs break-all">${escHtml(l.endpoint)}</td>
                    <td class="px-4 py-3 whitespace-nowrap"><span class="px-2 py-1 rounded-full text-[10px] uppercase font-bold tracking-wider ${badgeColor(l.type)}">${escHtml(l.type)}</span></td>
                    <td class="px-4 py-3 text-red-400 text-xs font-mono break-all line-clamp-2" title="${escHtml(l.payload)}">${escHtml(l.payload)}</td>
                </tr>`;
            });

            document.getElementById('logBody').innerHTML = rows || '<tr><td colspan="5" class="py-12 text-center text-gray-500">수집된 공격 로그가 없습니다.</td></tr>';
            
            // 통계 업데이트
            document.getElementById('statTotal').textContent = allLogs.length;
            document.getElementById('statSqli').textContent = sqli;
            document.getElementById('statRce').textContent = rce;
            document.getElementById('statOther').textContent = other;
            
        } catch (error) {
            console.error("Failed to fetch logs:", error);
            document.getElementById('logBody').innerHTML = '<tr><td colspan="5" class="py-12 text-center text-red-500">로그를 불러오는 중 오류가 발생했습니다.</td></tr>';
        }
    }

    // 이벤트 리스너 및 초기화
    document.getElementById('refreshBtn').addEventListener('click', fetchLogs);
    fetchLogs();
    setInterval(fetchLogs, 15000); // 15초마다 자동 갱신

    // AI Report 로직
    document.getElementById('aiReportBtn').addEventListener('click', async () => {
        const modal = document.getElementById('aiModal');
        const content = document.getElementById('aiContent');
        const btn = document.getElementById('aiReportBtn');
        
        // 로딩 상태 UI 처리
        btn.disabled = true;
        btn.textContent = '⏳ 분석 중...';
        content.innerHTML = '<div class="flex flex-col items-center justify-center py-20 text-indigo-400"><div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div><p class="font-bold animate-pulse">AI가 로그를 분석하고 있습니다...</p></div>';
        modal.classList.remove('hidden');

        try {
            const res = await fetch('/api/ai-report');
            const data = await res.json();
            
            if (data.status === 'success') {
                content.innerHTML = marked.parse(data.report);
            } else {
                content.innerHTML = `<div class="bg-red-900/30 border border-red-500 text-red-400 p-4 rounded-lg">${escHtml(data.message)}</div>`;
            }
        } catch (error) {
            content.innerHTML = `<div class="bg-red-900/30 border border-red-500 text-red-400 p-4 rounded-lg">서버와 통신하는 중 오류가 발생했습니다.</div>`;
        } finally {
            btn.disabled = false;
            btn.textContent = '🤖 AI 리포트 생성';
        }
    });

    // 모달 닫기
    document.getElementById('closeModal').addEventListener('click', () => {
        document.getElementById('aiModal').classList.add('hidden');
    });
    
    // 모달 바깥 영역 클릭 시 닫기
    document.getElementById('aiModal').addEventListener('click', (e) => {
        if(e.target === document.getElementById('aiModal')) {
            document.getElementById('aiModal').classList.add('hidden');
        }
    });
</script>
</body>
</html>
